name: carmel_akodessewa
description: "Application mobile de la Communauté des Frères Carmes Déchaux d'Akodésséwa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2          # gestion d'état
  http: ^1.2.1               # appels vers le bot Telegram (backend)
  shared_preferences: ^2.2.3 # mémoriser la langue choisie
  intl: ^0.19.0               # formats de date/heure

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
